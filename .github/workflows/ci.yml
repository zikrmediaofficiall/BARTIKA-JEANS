name: BARTIKA CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: bartika-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Dependency audit diagnostics
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const audit = require("./npm-audit.json");
          console.log("VULNERABILITY_COUNTS", JSON.stringify(audit.metadata?.vulnerabilities || {}));
          for (const [name, item] of Object.entries(audit.vulnerabilities || {})) {
            console.log("ADVISORY", JSON.stringify({
              name,
              severity: item.severity,
              isDirect: item.isDirect,
              range: item.range,
              via: item.via,
              fixAvailable: item.fixAvailable
            }));
          }
          NODE
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-build-only
