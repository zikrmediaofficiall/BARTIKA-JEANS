name: BARTIKA Android Release

on:
  workflow_run:
    workflows: ["BARTIKA CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bartika-android-release
  cancel-in-progress: false

jobs:
  build-android:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      TAG_NAME: v1.0.0-rc.1
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools
      - name: Install Android 16 SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          yes | sdkmanager --licenses >/dev/null || true
      - name: Verify Android project
        run: |
          gradle --version
          gradle -p android --no-daemon clean lintDebug testDebugUnitTest assembleDebug bundleDebug
      - name: Prepare QA artifacts
        run: |
          mkdir -p release-files
          cp android/app/build/outputs/apk/debug/app-debug.apk release-files/bartika-jeans-1.0.0-rc.1-debug.apk
          cp android/app/build/outputs/bundle/debug/app-debug.aab release-files/bartika-jeans-1.0.0-rc.1-debug.aab
          sha256sum release-files/* > release-files/SHA256SUMS.txt
          cat release-files/SHA256SUMS.txt
      - name: Upload APK and AAB workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bartika-jeans-android-1.0.0-rc.1
          path: release-files/*
          if-no-files-found: error
          retention-days: 30
      - name: Create tag and GitHub prerelease from the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            EXISTING_TAG_SHA=$(git rev-list -n 1 "$TAG_NAME")
            if [ "$EXISTING_TAG_SHA" != "$TARGET_SHA" ]; then
              echo "Refusing to attach artifacts to an existing tag on a different commit."
              exit 1
            fi
          else
            git tag -a "$TAG_NAME" "$TARGET_SHA" -m "BARTIKA JEANS Android $TAG_NAME"
            git push origin "$TAG_NAME"
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-files/* --clobber
          else
            gh release create "$TAG_NAME" release-files/bartika-jeans-1.0.0-rc.1-debug.apk release-files/bartika-jeans-1.0.0-rc.1-debug.aab release-files/SHA256SUMS.txt \
              --target "$TARGET_SHA" \
              --title "BARTIKA JEANS Android 1.0.0 RC1" \
              --prerelease \
              --notes "QA build from commit $TARGET_SHA. APK and AAB are debug-signed and are for internal testing only. A dedicated private upload keystore is required for a production Google Play release. Offline support in this build is limited to the POS queue and cached catalog; other admin modules require internet."
          fi
