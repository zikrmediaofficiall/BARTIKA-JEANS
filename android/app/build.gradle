plugins { id "com.android.application" }

// Version comes from the release tag (see .github/workflows/release.yml):
//   -PappVersionName=1.1.0 -PappVersionCode=10100   (code = major*10000 + minor*100 + patch)
def appVersionName = (project.findProperty("appVersionName") ?: "1.1.0").toString()
def appVersionCode = (project.findProperty("appVersionCode") ?: "10100").toString().toInteger()

android {
    namespace "com.bartika.jeans"
    compileSdk 36
    defaultConfig {
        applicationId "com.bartika.jeans"
        minSdk 24
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName
    }
    buildTypes {
        debug { applicationIdSuffix ".debug"; versionNameSuffix "-debug" }
        // Installable APK for GitHub Releases (sideload). Signed with the CI debug key, not a Play key.
        sideload {
            initWith debug
            applicationIdSuffix ""
            versionNameSuffix ""
            debuggable false
            minifyEnabled false
            signingConfig signingConfigs.debug
            matchingFallbacks = ["debug"]
        }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
